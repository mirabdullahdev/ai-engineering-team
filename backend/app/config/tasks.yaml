design_task:
  description: >
    Produce the engineering design for the following requirements.

    Requirements:
    {requirements}

    Output a markdown document with these sections:
    1. Overview: the system in three sentences.
    2. Files: every source file to be created and its owner (backend_engineer or frontend_engineer),
       with paths such as `src/app/page.tsx` and `src/lib/rules.ts` for the frontend. Do not list test files; the test engineer writes those.
    3. Backend interface: each class and function with a typed signature, a one-line contract,
       validation rules, and the exceptions raised.
    4. Frontend: the screens and components of the Next.js app, the files they live in, what the user can do on each, the
       business rules it must enforce in TypeScript, and the exact validation messages to show.
    5. Test plan: the behaviours and edge cases the test engineer must cover in the backend.

    Do not write implementation code, only signatures and contracts.
  expected_output: >
    A complete markdown design with the five sections above and no implementation code.
  agent: engineering_lead

code_task:
  description: >
    Implement the backend described in the design.

    Requirements:
    {requirements}

    Write the modules with your sandbox tools. Then write and run demo.py, a script that exercises the
    main flows and at least two error paths. Fix any failure before finishing.
  expected_output: >
    The backend module(s) and demo.py saved in the sandbox, matching the design's public interface,
    with a successful demo run.
  agent: backend_engineer
  context:
    - design_task

frontend_task:
  description: >
    Build the Next.js interface described in the Frontend section of the design.

    Requirements:
    {requirements}

    Edit the starter project with your web tools, put a first working version of the page in place early,
    then refine it. Run Check Web App and fix every issue it reports until it returns OK.
    The app must enforce the same business rules as the backend, in TypeScript.
  expected_output: >
    A complete, polished Next.js app in src/ that passes Check Web App.
  agent: frontend_engineer
  context:
    - design_task

test_task:
  description: >
    Write and run unit tests for the Python backend, fixing backend defects until every test passes.

    Requirements:
    {requirements}

    Cover the test plan from the design. Finish with a markdown summary stating the number of tests,
    the result, the behaviours covered, and any backend defects you fixed.
  expected_output: >
    Passing test files named test_*.py saved in the sandbox, and a markdown summary of the results.
  agent: test_engineer
  context:
    - design_task
    - code_task

fix_task:
  description: >
    The test suite for this project is failing. Fix the backend so every test passes.

    Requirements:
    {requirements}

    Current test output:
    {failures}

    Read the failing tests and the backend source, fix real defects in the backend, and run the
    failing test files again to confirm. Never edit a test to make it pass unless the test itself
    contradicts the requirements.
  expected_output: >
    The backend fixed in the sandbox, with the previously failing tests now passing.
  agent: backend_engineer

fix_web_task:
  description: >
    The Next.js app has errors. Fix them so it type-checks and renders.

    Requirements:
    {requirements}

    Current errors:
    {web_errors}

    Read the files involved, fix the real cause, and run Check Web App until it returns OK.
  expected_output: >
    The Next.js app fixed so that Check Web App returns OK.
  agent: frontend_engineer
